# CapitalPolicyGuard supplies live capital limits. These remaining guards do
# not replace durable halt, UNKNOWN, writer, book, audit or release authority.
hard_guards:
  manual_kill: {enabled: true}
  auth_health: {enabled: true}
  heartbeat: {enabled: true, sub_task_stale_threshold_seconds: 300}
  allocation_cap: {enabled: false}
  buying_power: {enabled: false}
calibrated_guards:
  realized_loss_24h: {enabled: true, threshold_pct: 5.0}
  drawdown_from_peak: {enabled: true, threshold_pct: 10.0}
  divergence_rate: {enabled: false, threshold_pct: null, window_minutes: null}

# Venue write throttle (a live writer refuses to start without it). Per-symbol
# offer terms (amount ceiling, periods, open offers, rate floor) are the applied
# CapitalPolicy envelope, set with scripts/amend_capital_policy.py
# (dry run -> digest -> apply).
pre_trade_limits:
  command_rate:                # submits + cancels through the command gate
    capacity: 12               # burst: a boot or reprice tick needs <= ~5
    refill_per_second: 0.1     # 6/min sustained vs a normal peak of ~3.3/min (5 per ~90 s tick)
    trip_blocks: 6             # this many throttled commands ...
    trip_window_seconds: 300   # ... within 5 minutes = a runaway loop -> HALTED/auto
