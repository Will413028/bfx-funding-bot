# Phase 4.4 canary safety config -- ALL required guards enabled for real money.
#
# build_daemon's canary invariant (assert_canary_guard_invariant) refuses to
# start under BFX_PHASE=canary unless the 4 hard guards + the 2 loss-limiters
# (realized_loss_24h, drawdown_from_peak) are all enabled. divergence_rate stays
# optional/off (no validated threshold yet).
#
# Select at deploy time: BFX_SAFETY_CONFIG=configs/safety.canary.yaml
# Both loss-limiters are PERCENTAGES of NAV, so they AUTO-SCALE with funded capital —
# add/withdraw funds without ever re-tuning the thresholds (5% 24h loss / 10% drawdown).
# allocation_cap (BFX_ALLOCATION_CAP_USDT) is the only absolute USDT knob; the balance-gate
# keeps actual lending at the funded available, so cap is just an upper bound, not in-risk size.
# fUSD remains dark until a separate reviewed recovery provides explicit coverage.
# No hot reload -- change here = redeploy.

hard_guards:
  manual_kill:
    enabled: true            # flip BFX_KILL_SWITCH=true env to halt all
  auth_health:
    enabled: true
  heartbeat:
    enabled: true
    sub_task_stale_threshold_seconds: 300
  allocation_cap:
    enabled: true
    caps: {fUSD: 0, fUST: 10000}  # fUSD is dark; fUST cap is an upper bound and balance-aware sizing still limits lending to funded available.
    default_cap: 0
  buying_power:
    enabled: true
    buffers: {fUST: 0}  # no implicit reserve; configure a positive per-symbol buffer deliberately.
    default_buffer: 0

calibrated_guards:
  realized_loss_24h:
    enabled: true
    threshold_pct: 5.0       # 24h NAV drop from the window-high, as % (auto-scales with funded; NAV normally only rises → catches anomalies/withdrawals)
  drawdown_from_peak:
    enabled: true
    threshold_pct: 10.0      # peak-to-trough NAV drawdown; funding shouldn't drawdown naturally, so 10% already signals trouble
  divergence_rate:
    enabled: false           # optional; no validated threshold yet
    threshold_pct: null
    window_minutes: null

# Always-on pre-trade limits (T9, ADR 2026-09-25 D5). A live writer refuses to
# start without this section; a symbol missing here cannot be offered at all.
# The per-offer AMOUNT ceiling is not here: it is CapitalPolicy.max_offer_amount,
# applied with scripts/amend_capital_policy.py (dry run -> digest -> apply).
pre_trade_limits:
  symbols:
    fUST:
      min_period_days: 2       # the venue minimum
      max_period_days: 2       # every live cell offers 2-day loans today; a longer-dated strategy must raise this (material)
      max_open_offers: 6       # 2 cells x up to 3 (reprice overlap); runaway posting stops at 6
      rate_floor_ratio: "0.5"  # offer >= 50% of the median live bid (exact period, else whole book)
  command_rate:                # submits + cancels through the command gate
    capacity: 12               # burst: a boot or reprice tick needs <= ~5
    refill_per_second: 0.1     # 6/min sustained vs a normal peak of ~3.3/min (5 per ~90 s tick)
    trip_blocks: 6             # this many throttled commands ...
    trip_window_seconds: 300   # ... within 5 minutes = a runaway loop -> HALTED/auto
