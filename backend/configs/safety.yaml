# Paper/shadow safety config. Loaded by build_daemon at startup.
#
# No hot reload — change here = redeploy.

hard_guards:
  manual_kill:
    enabled: true            # always-on: the trading-state guard
  auth_health:
    enabled: true
  heartbeat:
    enabled: true
    sub_task_stale_threshold_seconds: 300  # 5-minute watchdog
  allocation_cap:
    enabled: true
    caps: {fUSD: 400, fUST: 3000}  # per-symbol cap for simulation (paper/shadow); live sizes from the applied CapitalPolicy. guards AND reconciler sizing read caps[symbol].
    default_cap: 0
  buying_power:
    enabled: true
    buffers: {fUSD: 3, fUST: 3}
    default_buffer: 0

# NAV-drop alerts (level 4): a Telegram alert, never a stop. Funding NAV only
# falls through withdrawals, transfers or platform losses. null disables one.
nav_alerts:
  realized_loss_24h_pct: null
  drawdown_pct: null

# Venue write throttle (a live writer refuses to start without it). Per-symbol
# offer terms (amount ceiling, periods, open offers, rate floor) are the applied
# CapitalPolicy envelope, set with scripts/amend_capital_policy.py
# (dry run -> digest -> apply).
pre_trade_limits:
  command_rate:                # submits + cancels through the command gate
    capacity: 12               # burst: a boot or reprice tick needs <= ~5
    refill_per_second: 0.1     # 6/min sustained vs a normal peak of ~3.3/min (5 per ~90 s tick)
    trip_blocks: 6             # this many throttled commands ...
    trip_window_seconds: 300   # ... within 5 minutes = a runaway loop -> HALTED/auto
