    "bfx_funding_bot.external.bitfinex.live_executor -> bfx_funding_bot.modules.execution.errors",
    "bfx_funding_bot.external.bitfinex.live_executor -> bfx_funding_bot.modules.execution.events",
    "bfx_funding_bot.external.bitfinex.live_executor -> bfx_funding_bot.modules.execution.protocols",
