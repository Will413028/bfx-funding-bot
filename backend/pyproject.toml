    "bfx_funding_bot.external.bitfinex.ws_dispatcher -> bfx_funding_bot.modules.execution.registry_offers",
]
broken_contract_guidance = "Do not add ignores to fix a violation; move the offending code or ask the reviewer."

[[tool.importlinter.contracts]]
id = "runtime-not-research"
name = "Runtime modules do not import backtest"
type = "forbidden"
source_modules = [
    "bfx_funding_bot.modules.accounts",
    "bfx_funding_bot.modules.admin",
    "bfx_funding_bot.modules.api",
    "bfx_funding_bot.modules.candles",
    "bfx_funding_bot.modules.deployments",
    "bfx_funding_bot.modules.execution",
    "bfx_funding_bot.modules.external_signals",
    "bfx_funding_bot.modules.funding_stats",
    "bfx_funding_bot.modules.lending",
    "bfx_funding_bot.modules.marketfeed",
    "bfx_funding_bot.modules.observability",
