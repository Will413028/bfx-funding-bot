version: "2"

linters:
  default: standard
  enable:
    - prealloc
    # error handling — 對應 prompts/go.md
    - wrapcheck       # error 加 context: %w
    - errorlint       # error 比較 / 包裝正確
    # naming / style
    - revive          # interface naming, package naming
    - gocritic        # 多種品質檢查
    # testing
    - thelper         # t.Helper() 強制
    - tparallel       # parallel test 正確使用
    # mod
    - gomoddirectives # 禁止 replace directive (production)
  settings:
    govet:
      enable:
        - fieldalignment
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: var-naming
        - name: indent-error-flow
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - errors.New(
        - errors.Wrap(
        - errors.WithMessage(
        - errors.WithStack(
      ignorePackageGlobs:
        - github.com/will/bfx-funding-bot/*
    gomoddirectives:
      replace-allow-list: []
      replace-local: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - wrapcheck
