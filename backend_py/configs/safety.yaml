# Phase 4.2 default safety config. Loaded by build_daemon at startup.
# CalibratedGuard threshold values come from 4.3 G2 calibration; all
# disabled in 4.2. Enable in 4.4 once thresholds are validated against
# shadow data.
#
# No hot reload — change here = redeploy.

hard_guards:
  manual_kill:
    enabled: true            # always-on; flip BFX_KILL_SWITCH=true env to trip
  auth_health:
    enabled: true
  heartbeat:
    enabled: true
    sub_task_stale_threshold_seconds: 300  # 5-minute watchdog
  allocation_cap:
    enabled: true
    caps: {fUSD: 400, fUST: 3000}  # per-symbol cap; fUSD=400 mirrors safety.canary.yaml dry-run (this file is the non-canary default, NOT loaded by canary — canary.env sets BFX_SAFETY_CONFIG=configs/safety.canary.yaml). guards AND reconciler sizing read caps[symbol].
    default_cap: 0
  buying_power:
    enabled: true
    buffers: {fUSD: 3, fUST: 3}
    default_buffer: 0

calibrated_guards:
  realized_loss_24h:
    enabled: false           # 4.3 calibrate threshold; 4.4 enable
    threshold_pct: null      # % of NAV (auto-scales with funded capital)
  drawdown_from_peak:
    enabled: false
    threshold_pct: null
  divergence_rate:
    enabled: false
    threshold_pct: null
    window_minutes: null
