# Phase 4.4 canary safety config -- ALL required guards enabled for real money.
#
# build_daemon's canary invariant (assert_canary_guard_invariant) refuses to
# start under BFX_PHASE=canary unless the 4 hard guards + the 2 loss-limiters
# (realized_loss_24h, drawdown_from_peak) are all enabled. divergence_rate stays
# optional/off (no validated threshold yet).
#
# Select at deploy time: BFX_SAFETY_CONFIG=configs/safety.canary.yaml
# Both loss-limiters are PERCENTAGES of NAV, so they AUTO-SCALE with funded capital —
# add/withdraw funds without ever re-tuning the thresholds (5% 24h loss / 10% drawdown).
# allocation_cap (BFX_ALLOCATION_CAP_USDT) is the only absolute USDT knob; the balance-gate
# keeps actual lending at the funded available, so cap is just an upper bound, not in-risk size.
# No hot reload -- change here = redeploy.

hard_guards:
  manual_kill:
    enabled: true            # flip BFX_KILL_SWITCH=true env to halt all
  auth_health:
    enabled: true
  heartbeat:
    enabled: true
    sub_task_stale_threshold_seconds: 300
  allocation_cap:
    enabled: true
    caps: {fUSD: 400, fUST: 3000}  # active per-symbol cap (live fUST: 3000). fUSD=400 DRY-RUN 2026-06-02: USD UNFUNDED → per-symbol balance gate hard-blocks every fUSD offer (available=0); cap>0 only to satisfy the canary caps-invariant once fUSD cells are configured. guards AND reconciler sizing read caps[symbol].
    default_cap: 0
  buying_power:
    enabled: true
    buffers: {fUSD: 3, fUST: 3}
    default_buffer: 0

calibrated_guards:
  realized_loss_24h:
    enabled: true
    threshold_pct: 5.0       # 24h NAV drop from the window-high, as % (auto-scales with funded; NAV normally only rises → catches anomalies/withdrawals)
  drawdown_from_peak:
    enabled: true
    threshold_pct: 10.0      # peak-to-trough NAV drawdown; funding shouldn't drawdown naturally, so 10% already signals trouble
  divergence_rate:
    enabled: false           # optional; no validated threshold yet
    threshold_pct: null
    window_minutes: null
