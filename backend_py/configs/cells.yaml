# Phase 4.1 cells -- 11 strategy x cell pairs from Phase 3b WFO qualification.
# Params per cell copied from Phase 3b WFO best-param table.
# Update: any param change MUST sync to phase3b_wfo_results_ref doc.

cells:
  # -- MeanReversion (5 cells; fUST x p30 excluded — unqualified per Phase 3b)
  - strategy: mean_reversion
    symbol: fUSD
    period_agg: p2
    timeframe: 1h
    params: {threshold_sigma: 1.5, ratio_sigma: 0.0042, ema_alpha: 0.02}
    reference_amount_usdt: 150.0

  - strategy: mean_reversion
    symbol: fUSD
    period_agg: p30
    timeframe: 1h
    params: {threshold_sigma: 1.5, ratio_sigma: 0.0042, ema_alpha: 0.02}
