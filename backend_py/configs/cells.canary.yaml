# Phase 4.4 canary cells -- MINIMAL subset for first real-money run.
#
# CURRENCY: fUST (USDT) only. The operator funded the account with USDT, so the
# canary lends fUST. The 2 highest-WFO-margin MeanReversion fUST cells (both in
# QUALIFIED_PAIRS: mean_reversion fUST_a30, fUST_p2). RatePercentile is
# disqualified under LOCF (Task 10 sweep) -- excluded. p30 / fUST_p30 excluded.
#
# fUSD is intentionally DARK for this recovery: no canary cells and no allocation
# cap. It is reintroduced only by a separate reviewed change with fresh coverage.
#
# Params identical to configs/cells.yaml (do not re-tune here).
# Select at deploy time: BFX_CELLS_YAML=configs/cells.canary.yaml
#
# Sizing (deployment reconciler, spec 2026-05-29-deployment-reconciler):
# Single-order size is no longer set here. The deployment reconciler fills the
# gap toward target_exposure (= BFX_ALLOCATION_CAP_USDT, set 570 on Koyeb) using
# greedy emptiest-first allocation, per-cell capped at 70% of target, each offer
# >= effective_min (ceil(150*1.02)=153 USDT) to clear the venue USD minimum.

cells:
  - strategy: mean_reversion
    symbol: fUST
    period_agg: a30
    timeframe: 1h
    params: {threshold_sigma: 0.5, ratio_sigma: 0.42049266874194213, ema_span: 24}

  - strategy: mean_reversion
    symbol: fUST
    period_agg: p2
    timeframe: 1h
    params: {threshold_sigma: 0.5, ratio_sigma: 0.4062263004196277, ema_span: 24}

phase3b_wfo_results_ref: docs/research/2026-05-18-phase3b-wfo-results.md
