[project]
name = "bfx-funding-bot-py"
version = "0.1.0"
description = "Bitfinex funding bot — Python rewrite"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",       # sync driver for alembic env.py (async runtime uses asyncpg)
    "alembic>=1.14",
    "httpx>=0.28",
    "aiolimiter>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "websockets>=14.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # Runtime deps for backtest.strategies (imported by marketfeed.signal_engine
    # via strategy_registry); pandas used by backtest.eda which is in the wheel
    # tree even though not on daemon hot path. Moved from dev-group at Phase 4.1
    # deploy time after container ModuleNotFoundError.
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "hypothesis>=6.115",
    "freezegun>=1.5",
    "pytest-mock>=3.14",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
bfx-shadow = "bfx_funding_bot.modules.marketfeed.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bfx_funding_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiolimiter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests requiring network/live services (deselect with '-m \"not integration\"')",
    "property: hypothesis-based property tests; CI default 100 iter, nightly 1k, pre-ship manual 10k",
    "live: requires real Bitfinex / Axiom credentials; never runs in CI",
    "benchmark: performance gates (R4.1.1 replay budget) — run manually",
]
