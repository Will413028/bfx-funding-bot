name: Install PostgreSQL 18 (PGDG)
description: >-
  Server binaries only; each pytest process initialises and runs its own throwaway
  cluster (backend/tests/pg_local.py). Callers set BFX_TEST_PG_BIN to
  /usr/lib/postgresql/18/bin.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-common
        sudo sed -i 's/^#\?create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
        sudo apt-get install -y --no-install-recommends postgresql-18
        /usr/lib/postgresql/18/bin/pg_ctl --version
