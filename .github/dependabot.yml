version: 2
# Cooldown: version updates wait 7 days after a release (security updates do not),
# matching uv exclude-newer and pnpm minimumReleaseAge. Patch bumps are grouped.
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories: ["/backend", "/deploy/vm/ops"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-patch:
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # react-dom must match react exactly; bumping one alone breaks rendering.
      react:
        patterns: ["react", "react-dom"]
      npm-patch:
        update-types: ["patch"]
    ignore:
      # Types follow the Node runtime (node:22 in backend/Dockerfile, CI node-version 22);
      # a major moves with the runtime, not as a weekly bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/deploy/vm/postgres"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-patch:
        update-types: ["patch"]
    ignore:
      # Base images stay on the current LTS line; a major (e.g. node 22 -> 25)
      # is a deliberate upgrade, not a weekly bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
