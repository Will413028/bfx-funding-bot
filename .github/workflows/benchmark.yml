name: Benchmark

# Wall-clock budgets (the `benchmark` marker in pyproject.toml), run serially on a
# runner of their own: under the unit job's `-n auto` they share the CPU with every
# other worker and measure the contention. A separate workflow on purpose:
# release.yml publishes only after the workflow named "CI" passes, so runner timing
# noise never gates a release.

on:
  pull_request:
    branches: [main]
    paths:
      - backend/src/bfx_funding_bot/modules/marketfeed/divergence_reporter.py
      - backend/src/bfx_funding_bot/modules/marketfeed/strategy_registry.py
      - backend/src/bfx_funding_bot/modules/strategy/**
      - backend/tests/benchmark/**
      - .github/workflows/benchmark.yml
  schedule:
    - cron: "47 19 * * *"  # nightly, 03:47 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmark budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz (all these jobs run on x64).
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m benchmark -q
