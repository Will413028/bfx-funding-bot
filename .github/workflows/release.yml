name: Release images

# Builds the production images once, in CI, from a main commit whose CI run
# passed, and publishes them to GHCR. The VM deploys by digest only; the `main`
# tag exists so the VM can discover the newest release, never as deploy input.
# `bfx.ci-run-url` names the CI run that passed this commit; bfx-deploy writes it
# into the deployments ledger (ci_run).
# See wiki ADR 2026-09-25-ci-registry-digest-deploy.

# zizmor: workflow_run runs with the base repository's token. Safe here because the
# job only runs for completed `push` runs on main (see `if:` below), never for a
# pull_request run, so no fork-controlled code or ref reaches this workflow.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Releases publish in commit order; a newer one must not be cancelled midway.
  group: release-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push images (linux/arm64)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # Native arm64: production (OCI A1) is arm64, so no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image names
        id: names
        env:
          # Public build inputs (baked into the client bundle; not secrets) come
          # from repository variables so the deployment's host name stays out of
          # the source tree. A missing value fails the release instead of baking
          # an empty URL into the image.
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BETTER_AUTH_URL: ${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${prefix}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}-frontend" >> "$GITHUB_OUTPUT"
          keys="NEXT_PUBLIC_APP_NAME NEXT_PUBLIC_APP_URL NEXT_PUBLIC_BETTER_AUTH_URL NEXT_PUBLIC_SENTRY_DSN"
          for key in $keys; do
            if [ -z "${!key}" ]; then
              echo "::error::repository variable $key is not set"
              exit 1
            fi
          done
          {
            echo "frontend_args<<EOF"
            for key in $keys; do echo "$key=${!key}"; done
            echo "NEXT_PUBLIC_SENTRY_RELEASE=${REVISION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # workflow_run events can complete out of order (e.g. after an Actions
      # backlog). Only the current head of main may move the `main` discovery
      # tag; an older revision still gets its immutable sha tag.
      - name: Check whether this revision is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head" = "$REVISION" ]; then
            echo "main_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_tag=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${REVISION} is no longer the head of main (${head}); publishing sha tags only"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            bfx.ci-run-url=${{ github.event.workflow_run.html_url }}
          tags: |
            ${{ steps.names.outputs.backend }}:sha-${{ env.REVISION }}
            ${{ steps.head.outputs.main_tag == 'true' && format('{0}:main', steps.names.outputs.backend) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          build-args: ${{ steps.names.outputs.frontend_args }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            bfx.ci-run-url=${{ github.event.workflow_run.html_url }}
          tags: |
            ${{ steps.names.outputs.frontend }}:sha-${{ env.REVISION }}
            ${{ steps.head.outputs.main_tag == 'true' && format('{0}:main', steps.names.outputs.frontend) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Record release
        env:
          MAIN_TAG: ${{ steps.head.outputs.main_tag }}
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "### Release ${REVISION} (main tag: ${MAIN_TAG})"
            echo ""
            echo "| image | digest |"
            echo "|---|---|"
            echo "| ${BACKEND_IMAGE} | \`${BACKEND_DIGEST}\` |"
            echo "| ${FRONTEND_IMAGE} | \`${FRONTEND_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
