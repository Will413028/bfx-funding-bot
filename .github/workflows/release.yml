name: Release images

# Builds the production image once, in CI, from a main commit whose CI run
# passed, and publishes it to GHCR. Since 9d-5 there is one image: the backend,
# which also carries the operator UI's static export (backend/Dockerfile `ui` stage). The VM deploys by digest only; the `main`
# tag exists so the VM can discover the newest release, never as deploy input.
# `bfx.ci-run-url` names the CI run that passed this commit; bfx-deploy writes it
# into the deployments ledger (ci_run).
# The pushed digest gets a signed SLSA build provenance attestation (actions/attest,
# Sigstore public-good: the repository is public), stored in the repository's attestation
# API; bfx-deploy reads it there anonymously and verifies it with `gh attestation verify
# --bundle` against the manifest it read from GHCR, before it runs anything from the image
# (plan 9i, threat model F32).
# The image also carries a BuildKit SBOM attestation (SPDX, from the pinned syft scanner):
# the inventory of its OS and Python packages (ASVS V15.1.2), read with
# `docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'`. The pushed digest was
# already an index (BuildKit's own provenance attestation rides in it), so adding the SBOM
# does not change what bfx-deploy reads. The SBOM is an inventory, not the vulnerability
# scan's input: syft names the Debian ecosystem `Debian:13.7`, which matches no OSV advisory
# (measured 2026-10-24, osv-scanner 2.6.0: 0 Debian findings from the SBOM, 164 from
# scanning the same image).
# See wiki ADR 2026-09-25-ci-registry-digest-deploy.

# zizmor: workflow_run runs with the base repository's token. Safe here because the
# job only runs for completed `push` runs on main (see `if:` below), never for a
# pull_request run, so no fork-controlled code or ref reaches this workflow.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Releases publish in commit order; a newer one must not be cancelled midway.
  group: release-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the image (linux/arm64)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # Native arm64: production (OCI A1) is arm64, so no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      # Push the image.
      packages: write
      # Mint the OIDC token Sigstore turns into the signing certificate: its identity is
      # this workflow on main, which is what bfx-deploy's --signer-workflow requires.
      id-token: write
      # Record the attestation in the repository's attestations API.
      attestations: write
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image names
        id: names
        env:
          # The UI's public build input (baked into the bundle; not a secret) comes
          # from a repository variable. A missing value fails the release instead of
          # shipping a UI that silently reports nothing.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${prefix}-backend" >> "$GITHUB_OUTPUT"
          keys="NEXT_PUBLIC_SENTRY_DSN"
          for key in $keys; do
            if [ -z "${!key}" ]; then
              echo "::error::repository variable $key is not set"
              exit 1
            fi
          done
          {
            echo "build_args<<EOF"
            echo "GIT_SHA=${REVISION}"
            for key in $keys; do echo "$key=${!key}"; done
            echo "NEXT_PUBLIC_SENTRY_RELEASE=${REVISION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # workflow_run events can complete out of order (e.g. after an Actions
      # backlog). Only the current head of main may move the `main` discovery
      # tag; an older revision still gets its immutable sha tag.
      - name: Check whether this revision is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head" = "$REVISION" ]; then
            echo "main_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_tag=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${REVISION} is no longer the head of main (${head}); publishing sha tags only"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          # The UI stage copies the frontend from this named context.
          build-contexts: frontend=frontend
          platforms: linux/arm64
          push: true
          build-args: ${{ steps.names.outputs.build_args }}
          # docker/buildkit-syft-scanner v1.12.0 (Will 2026-10-24).
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            bfx.ci-run-url=${{ github.event.workflow_run.html_url }}
          tags: |
            ${{ steps.names.outputs.backend }}:sha-${{ env.REVISION }}
            ${{ steps.head.outputs.main_tag == 'true' && format('{0}:main', steps.names.outputs.backend) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Sign the digest the VM will deploy (the subject is that digest: the sha256 of the
      # manifest the registry serves for it). subject-name has no tag (actions/attest
      # README). Stored only in the attestation API, which bfx-deploy reads: no copy is
      # pushed to GHCR (push-to-registry defaults to false; nothing reads it there, and
      # the storage record exists only with it).
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.backend }}
          subject-digest: ${{ steps.backend.outputs.digest }}

      - name: Record release
        env:
          MAIN_TAG: ${{ steps.head.outputs.main_tag }}
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### Release ${REVISION} (main tag: ${MAIN_TAG})"
            echo ""
            echo "| image | digest |"
            echo "|---|---|"
            echo "| ${BACKEND_IMAGE} | \`${BACKEND_DIGEST}\` |"
            echo ""
            echo "Provenance: ${ATTESTATION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
