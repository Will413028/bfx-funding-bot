name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main-push runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend

      - name: go test
        run: go test ./... -count=1 -race -timeout 5m

      - name: go build
        run: go build -o /dev/null ./cmd/server/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm biome check src/

      - name: Unit tests
        run: pnpm vitest run

  backend_py_unit:
    name: Backend (Python) — unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend_py
    steps:
      # NOTE: Actions @v4/@v3 acceptable per OpenSSF transitional guidance.
      # Dependabot (.github/dependabot.yml) auto-bumps these to commit SHA via
      # weekly PRs.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run mypy --strict src
      - run: uv run pytest -m "not integration" -q

  backend_py_integration:
    name: Backend (Python) — integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: backend_py_unit
    # Fork PRs cannot read secrets (GitHub security model); skip them. Same-repo
    # PRs and main pushes run the real Axiom round-trip.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    defaults:
      run:
        working-directory: backend_py
    env:
      AXIOM_API_KEY: ${{ secrets.AXIOM_CI_API_KEY }}
      AXIOM_DATASET: ${{ secrets.AXIOM_CI_DATASET }}
      BFX_DEPLOYMENT_ENV: ci
      BFX_SERVICE_VERSION: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m integration -q --maxfail=3
