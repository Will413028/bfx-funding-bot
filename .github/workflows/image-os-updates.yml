name: Image OS security updates

# The released image's OS layer (ASVS V15.2.1). Gate: a Debian security update the image does
# not have, unless image-os-updates.toml lists it with a future date
# (scripts/image_os_updates.py). The OSV report below never fails the job: most findings for
# the Debian base have no fix Debian has shipped. The report scans the image itself, not the
# release's SBOM: syft names the ecosystem `Debian:13.7`, which matches no OSV advisory.
#
# Called, never triggered on its own:
# - ci.yml after `release` on a main push, on the image that release just pushed
#   (`sha-<commit>`). Run from security.yml on the same push it raced the release and read the
#   previous `main` image, so a release that dropped a baseline exemption went red.
# - security.yml on the weekly schedule and on demand, on the newest release (`main`): new
#   advisories appear after an image was built.
# Not on pull requests: the image is main's newest release, the same for every PR, so a new
# advisory would turn every PR red at once.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag of the backend image in GHCR: sha-<commit> or main."
        type: string
        required: true

permissions:
  contents: read

jobs:
  image_os_updates:
    # Callers name themselves (Release / Scheduled image OS updates); this reads `<caller> / check`.
    name: check
    # Native arm64: the image is linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      # Pull the private image from GHCR.
      packages: read
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: 2c71403eb443d05891c4f268c3ad771cf4f16e5443463fd7851ef8f454d3c7e4
      IMAGE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        run: |
          [[ $IMAGE_TAG =~ ^(main|sha-[0-9a-f]{40})$ ]] || { echo "unexpected tag: $IMAGE_TAG"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend:${IMAGE_TAG}"
          docker pull --quiet "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"  # for the next steps
      - name: Debian security updates the image does not have
        run: |
          docker run --rm --user 0 --entrypoint sh "$IMAGE" \
            -c 'apt-get update -qq >/dev/null && apt list --upgradable 2>/dev/null' > "$RUNNER_TEMP/upgradable.txt"
          python3 scripts/image_os_updates.py --baseline image-os-updates.toml < "$RUNNER_TEMP/upgradable.txt"
      - name: Install osv-scanner
        if: ${{ !cancelled() }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_arm64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Exit 1 means findings (expected); anything else is a scanner failure.
      - name: OSV report (does not fail the job)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan image "$IMAGE" \
            --format markdown > "$RUNNER_TEMP/osv-image.md" || rc=$?
          echo "osv-scanner exit $rc; $(grep -c '^|' "$RUNNER_TEMP/osv-image.md" || true) table rows in the report"
          [ "$rc" -le 1 ] || exit "$rc"
          cat "$RUNNER_TEMP/osv-image.md" >> "$GITHUB_STEP_SUMMARY"

