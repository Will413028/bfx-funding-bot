name: Mutation kill matrix

# Which tests kill which mutants of one file (backend/scripts/mutation_kill_matrix.py), run on
# demand because one run is a full test selection per mutant. The report is an artifact; the
# workflow gates nothing (release.yml publishes only after the workflow named "CI").

on:
  workflow_dispatch:
    inputs:
      source:
        description: File to mutate, relative to the repository root
        required: true
        type: string
      module_name:
        description: Module it runs under when a test loads it by path (empty for backend/src)
        required: false
        type: string
        default: ""
      pytest_args:
        description: The tests to run, from backend/, as one shell-quoted string
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  kill_matrix:
    name: Kill matrix
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    env:
      BFX_DEPLOYMENT_ENV: ci
      BFX_TEST_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz (all these jobs run on x64).
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: true
      - run: uv sync --all-groups
      - uses: ./.github/actions/postgres-18
      # Inputs reach the script through the environment only; it splits PYTEST_ARGS itself.
      - name: Kill matrix
        env:
          SOURCE: ${{ inputs.source }}
          MODULE_NAME: ${{ inputs.module_name }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: >-
          uv run python scripts/mutation_kill_matrix.py
          --source "$SOURCE" ${MODULE_NAME:+--module-name "$MODULE_NAME"}
          --pytest-args "$PYTEST_ARGS" --jobs "$(nproc)"
          --out "$RUNNER_TEMP/kill-matrix.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kill-matrix
          path: ${{ runner.temp }}/kill-matrix.json
          if-no-files-found: ignore
