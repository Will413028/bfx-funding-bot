name: Venue contract

# Once a day, ask Bitfinex's public endpoints whether they still answer in the shape
# external/bitfinex parses (backend/tests/contracts/test_bitfinex_public_venue.py, the
# `venue_contract` marker), and the public proof site whether it answers and is this
# week's (test_public_site_live.py, `public_site`). No credentials: the authenticated rows stay pinned by the
# canned samples in test_bitfinex_contract.py. Not a required check: a venue change is
# not a property of a PR. A failure goes to the operator's Telegram chat, the same one
# bfx-notify and the bot alert to.
#
# A green run sends nothing, so a schedule GitHub stopped (60 days without a commit
# to the repository) is silent too; operations.md §8 says how to re-enable it.

on:
  pull_request:
    branches: [main]
    paths:
      - backend/tests/contracts/test_bitfinex_public_venue.py
      - backend/tests/contracts/test_public_site_live.py
      - .github/workflows/venue-contract.yml
  schedule:
    - cron: "37 0 * * *"  # daily, 08:37 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Bitfinex public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz (all these jobs run on x64).
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m venue_contract -q -rf

  public-site:
    name: Public proof site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz (all these jobs run on x64).
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m public_site -q -rf

  notify:
    name: Telegram on failure
    needs: [contract, public-site]
    # failure() covers a failed step and a job that hit its timeout; a cancelled run
    # (a newer push to the same PR) is not news.
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --output /dev/null \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=bfx daily external check FAILED (${EVENT} on ${REF}): Bitfinex public endpoints vs our parsers, or the public proof site (borrowrate.pages.dev) down or stale; the run says which. ${RUN_URL}" \
            --data "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
