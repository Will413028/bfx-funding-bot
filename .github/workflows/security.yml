name: Security

# Supply-chain checks. Scanner binaries are pinned by version and sha256; actions
# by commit SHA. The weekly run re-scans main: advisories for packages already in
# a lockfile often appear after the version was locked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 1 * * 1"  # Mondays, 09:23 Asia/Taipei
  # Runs image_os_updates on demand (it does not run on pull requests).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # scan the full history; .gitleaksignore lists reviewed false positives
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .'

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      # shellcheck on the runner image also checks every run: block.
      - run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails on any finding, including unpinned-uses (actions referenced by tag).
      # Config: .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.30.1"
          advanced-security: "false"

  osv_scanner:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      # SPDX ids a dependency may carry; why each is here: osv-scanner.toml.
      OSV_LICENSE_ALLOWLIST: "0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC0-1.0,ISC,LGPL-3.0-only,LGPL-3.0-or-later,MIT,MIT-0,MPL-2.0,PSF-2.0,Python-2.0,Zlib"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Recursive, so a new lockfile is scanned without editing this job.
      # osv-scanner.toml holds the dated baseline; an expired entry fails this job.
      # --licenses also fails on any license outside the allowlist.
      - run: '"$RUNNER_TEMP/osv-scanner" scan source -r --config osv-scanner.toml --licenses="$OSV_LICENSE_ALLOWLIST" .'

  image_os_updates:
    # The released image's OS layer (ASVS V15.2.1). Gate: a Debian security update the
    # image does not have, unless image-os-updates.toml lists it with a future date
    # (scripts/image_os_updates.py). The OSV report below never fails the job: most
    # findings for the Debian base have no fix Debian has shipped. The report scans the
    # image itself, not the release's SBOM: syft names the ecosystem `Debian:13.7`, which
    # matches no OSV advisory. Not on pull requests: the image is the newest release on
    # main, the same for every PR, so a new advisory would turn every PR red at once.
    name: Image OS security updates
    if: github.event_name != 'pull_request'
    # Native arm64: the image is linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      # Pull the private image from GHCR.
      packages: read
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: 2c71403eb443d05891c4f268c3ad771cf4f16e5443463fd7851ef8f454d3c7e4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the newest release
        run: docker pull --quiet "ghcr.io/${GITHUB_REPOSITORY,,}-backend:main"
      - name: Debian security updates the image does not have
        run: |
          docker run --rm --user 0 --entrypoint sh "ghcr.io/${GITHUB_REPOSITORY,,}-backend:main" \
            -c 'apt-get update -qq >/dev/null && apt list --upgradable 2>/dev/null' > "$RUNNER_TEMP/upgradable.txt"
          python3 scripts/image_os_updates.py --baseline image-os-updates.toml < "$RUNNER_TEMP/upgradable.txt"
      - name: Install osv-scanner
        if: ${{ !cancelled() }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_arm64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Exit 1 means findings (expected); anything else is a scanner failure.
      - name: OSV report (does not fail the job)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan image "ghcr.io/${GITHUB_REPOSITORY,,}-backend:main" \
            --format markdown > "$RUNNER_TEMP/osv-image.md" || rc=$?
          echo "osv-scanner exit $rc; $(grep -c '^|' "$RUNNER_TEMP/osv-image.md" || true) table rows in the report"
          [ "$rc" -le 1 ] || exit "$rc"
          cat "$RUNNER_TEMP/osv-image.md" >> "$GITHUB_STEP_SUMMARY"
