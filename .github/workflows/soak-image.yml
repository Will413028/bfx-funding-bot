name: Soak image

# Builds the backend image from a dev commit for a simulated-venue soak before the
# dev→main release (docs/runbooks/simulation-soak.md §4.1 "發版前 soak"). Release images
# exist only for main (release.yml), so without this a soak could only run code that is
# already deployed.
#
# It can never be deployed: bfx-deploy discovers releases through the `main` tag only and
# runs a digest only after verifying a provenance attestation signed by release.yml on
# refs/heads/main (bfx_deploy.py RELEASE_WORKFLOW, --source-ref). This workflow pushes only a
# `soak-sha-<sha>` tag and attests nothing. Same package as the release (public, so the VM
# pulls it anonymously, as it does releases).
#
# The build cache is read, never written: dev is the default branch, so a cache written
# here would be readable by release.yml on main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push the soak image (linux/arm64)
    # Only a dev commit: anything else would soak code that is not headed for a release.
    if: github.ref == 'refs/heads/dev'
    concurrency:
      group: soak-image
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve image names
        id: names
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${prefix}-backend" >> "$GITHUB_OUTPUT"
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN}" ]; then
            echo "::error::repository variable NEXT_PUBLIC_SENTRY_DSN is not set"
            exit 1
          fi
          {
            echo "build_args<<EOF"
            echo "GIT_SHA=${REVISION}"
            echo "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}"
            echo "NEXT_PUBLIC_SENTRY_RELEASE=${REVISION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          build-contexts: frontend=frontend
          platforms: linux/arm64
          push: true
          build-args: ${{ steps.names.outputs.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            bfx.soak-only=true
          tags: ${{ steps.names.outputs.backend }}:soak-sha-${{ env.REVISION }}
          cache-from: type=gha,scope=backend

      - name: Record soak image
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          {
            echo "### Soak image ${REVISION} (not deployable)"
            echo ""
            echo "\`${BACKEND_IMAGE}@${BACKEND_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
