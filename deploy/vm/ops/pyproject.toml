# Host tooling for the VM (bfx-deploy, bfx-notify, bfx-backup-check,
# bfx-restore-test). Not a package: bfx-deploy (and install.sh on first
# install) runs `uv sync --frozen --no-install-project` into
# /usr/local/lib/bfx-ops/releases/<rev>/.venv, so the VM runs exactly the
# versions and hashes pinned in uv.lock on Ubuntu 24.04's python3.12.
[project]
name = "bfx-ops"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "pathspec==1.1.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
