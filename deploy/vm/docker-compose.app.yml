# Application services only (bot, webapi, frontend), deployed by bfx-deploy
# (deploy/vm/ops/bfx_deploy.py) from the release's own commit:
#
#   docker compose -p bfx-app -f <release>/docker-compose.app.yml \
#     up -d --no-deps bot webapi frontend
#
# PostgreSQL and Redis stay in docker-compose.bot.yml (project `bfx`) and are never
# defined, recreated or touched here. This project only joins their existing
# `bfx_default` network.
#
# Images: bfx-deploy supplies complete `<repository>@sha256:<digest>` references
# resolved from GHCR; this file never names a tag and never builds. pull_policy
# never mirrors the old `docker create --pull=never`: bfx-deploy pulls by digest
# first, so `up` can only start what was already verified.
#
# Hardening kept from the retired immutable-release launcher (removed in T6):
# read-only root filesystem, bot/webapi UID 1000, frontend user nextjs, all
# capabilities dropped, no-new-privileges, cwd /app, the image's exact
# interpreter/module, bot DNS alias bfx-bot, frontend published on host loopback
# 127.0.0.1:3001 only, no volumes, no writable mounts, loader and interpreter
# injection variables forced empty. CI renders this file with `docker compose
# config` and enforces all of it (deploy/vm/ops/compose_policy.py); bfx-deploy
# re-checks only the digest and identity each created container runs with.
#
# Identity (injected by bfx-deploy, never set in env files): BFX_IMAGE_DIGEST,
# BFX_SOURCE_REVISION, BFX_CHANGE_CLASS and BFX_DEPLOYMENT_ID, the attempt_id of
# the `started` row in the deployments ledger for this deployment.
#
# Env precedence: `environment` > later env_file > earlier env_file. Secrets stay in
# /opt/bfx/runtime/*.env (root 0600, never in git); non-secret bot settings come
# from live.env at the same commit as this file. BFX_RUNTIME_DIR exists only so CI
# can render this file without the secret directory (older Compose stats env files
# even with --no-env-resolution); bfx-deploy passes its own --runtime-dir, and the
# default must stay /opt/bfx/runtime (compose_policy.py checks it). The files stay
# required: a missing secret file must stop `up`, never start without it.

name: bfx-app

services:
  bot:
    image: ${BFX_BACKEND_IMAGE:?BFX_BACKEND_IMAGE must be a repository@sha256 reference}
    pull_policy: never
    container_name: bfx-bot
    entrypoint: []
    command: ["/app/.venv/bin/python", "-m", "bfx_funding_bot.modules.marketfeed.daemon"]
    user: "1000:1000"
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/bot.env
      - live.env
    environment:
      BFX_IMAGE_DIGEST: ${BFX_BACKEND_DIGEST:?BFX_BACKEND_DIGEST is required}
      BFX_SOURCE_REVISION: ${BFX_SOURCE_REVISION:?BFX_SOURCE_REVISION is required}
      BFX_CHANGE_CLASS: ${BFX_CHANGE_CLASS:?BFX_CHANGE_CLASS is required}
      BFX_DEPLOYMENT_ID: ${BFX_DEPLOYMENT_ID:?BFX_DEPLOYMENT_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUSERBASE: ""
      LD_PRELOAD: ""
      LD_LIBRARY_PATH: ""
      LD_AUDIT: ""
    networks:
      bfx_default:
        aliases: [bfx-bot]

  webapi:
    image: ${BFX_BACKEND_IMAGE:?BFX_BACKEND_IMAGE must be a repository@sha256 reference}
    pull_policy: never
    container_name: bfx-webapi
    entrypoint: []
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "bfx_funding_bot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    user: "1000:1000"
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/webapi.env
    environment:
      BFX_IMAGE_DIGEST: ${BFX_BACKEND_DIGEST:?BFX_BACKEND_DIGEST is required}
      BFX_SOURCE_REVISION: ${BFX_SOURCE_REVISION:?BFX_SOURCE_REVISION is required}
      BFX_CHANGE_CLASS: ${BFX_CHANGE_CLASS:?BFX_CHANGE_CLASS is required}
      BFX_DEPLOYMENT_ID: ${BFX_DEPLOYMENT_ID:?BFX_DEPLOYMENT_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUSERBASE: ""
      LD_PRELOAD: ""
      LD_LIBRARY_PATH: ""
      LD_AUDIT: ""
    networks:
      bfx_default: {}

  frontend:
    image: ${BFX_FRONTEND_IMAGE:?BFX_FRONTEND_IMAGE must be a repository@sha256 reference}
    pull_policy: never
    container_name: bfx-frontend
    entrypoint: []
    command: ["node", "server.js"]
    user: nextjs
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/frontend.env
    environment:
      BFX_IMAGE_DIGEST: ${BFX_FRONTEND_DIGEST:?BFX_FRONTEND_DIGEST is required}
      BFX_SOURCE_REVISION: ${BFX_SOURCE_REVISION:?BFX_SOURCE_REVISION is required}
      BFX_CHANGE_CLASS: ${BFX_CHANGE_CLASS:?BFX_CHANGE_CLASS is required}
      BFX_DEPLOYMENT_ID: ${BFX_DEPLOYMENT_ID:?BFX_DEPLOYMENT_ID is required}
      NODE_OPTIONS: ""
      LD_PRELOAD: ""
      LD_LIBRARY_PATH: ""
      LD_AUDIT: ""
    ports:
      # Host 3000 is Grafana; Tailscale Funnel 443 -> 127.0.0.1:3001. Loopback only.
      - "127.0.0.1:3001:3000"
    networks:
      bfx_default: {}

networks:
  bfx_default:
    external: true
    name: bfx_default
