# Application services (bot, webapi) and the tailnet ingress (netns, tailscale),
# deployed by bfx-deploy
# (deploy/vm/ops/bfx_deploy.py) from the release's own commit. bfx-deploy takes
# the services, containers, images and env files from this file's rendering
# (`docker compose config --no-env-resolution`) and runs:
#
#   docker compose -p bfx-app -f <release>/docker-compose.app.yml \
#     up -d --no-deps --remove-orphans <every service defined here>
#
# PostgreSQL and Redis stay in docker-compose.bot.yml (project `bfx`) and are never
# defined, recreated or touched here. This project only joins their existing
# `bfx_default` network.
#
# Images: bfx-deploy supplies complete `<repository>@sha256:<digest>` references
# resolved from GHCR; this file never names a tag and never builds. The ingress
# services name the one allowlisted third-party digest (tailscale), which
# bfx-deploy pulls by digest without the registry token. pull_policy
# never mirrors the old `docker create --pull=never`: bfx-deploy pulls by digest
# first, so `up` can only start what was already verified.
#
# Hardening kept from the retired immutable-release launcher (removed in T6):
# read-only root filesystem, bot/webapi UID 1000, all capabilities dropped,
# no-new-privileges, cwd /app, the image's exact interpreter/module, bot DNS alias
# bfx-bot, no published ports, no volumes, no writable mounts, loader and interpreter
# injection variables forced empty. The web API serves the operator UI (the
# frontend's static export, baked into the backend image) on 127.0.0.1:8000 inside
# the tailnet node's namespace: Tailscale Serve is the only way in (9d-5). CI renders this file with `docker compose
# config` and enforces all of it (deploy/vm/ops/compose_policy.py); bfx-deploy
# re-checks only the digest and identity each created container runs with.
#
# Identity (injected by bfx-deploy, never set in env files): BFX_IMAGE_DIGEST,
# BFX_SOURCE_REVISION and BFX_DEPLOYMENT_ID, the attempt_id of the `started` row
# in the deployments ledger for this deployment.
#
# Env precedence: `environment` > later env_file > earlier env_file. Secrets stay in
# /opt/bfx/runtime/*.env (root 0600, never in git); non-secret bot settings come
# from live.env at the same commit as this file. BFX_RUNTIME_DIR exists only so CI
# can render this file without the secret directory (older Compose stats env files
# even with --no-env-resolution); bfx-deploy passes its own --runtime-dir, and the
# default must stay /opt/bfx/runtime (compose_policy.py checks it). The files stay
# required: a missing secret file must stop `up`, never start without it.

name: bfx-app

services:
  bot:
    image: ${BFX_BACKEND_IMAGE:?BFX_BACKEND_IMAGE must be a repository@sha256 reference}
    pull_policy: never
    container_name: bfx-bot
    entrypoint: []
    command: ["/app/.venv/bin/python", "-m", "bfx_funding_bot.apps.bot"]
    user: "1000:1000"
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/bot.env
      - live.env
    environment:
      BFX_IMAGE_DIGEST: ${BFX_BACKEND_DIGEST:?BFX_BACKEND_DIGEST is required}
      BFX_SOURCE_REVISION: ${BFX_SOURCE_REVISION:?BFX_SOURCE_REVISION is required}
      BFX_DEPLOYMENT_ID: ${BFX_DEPLOYMENT_ID:?BFX_DEPLOYMENT_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUSERBASE: ""
      LD_PRELOAD: ""
      LD_LIBRARY_PATH: ""
      LD_AUDIT: ""
    networks:
      bfx_default:
        aliases: [bfx-bot]

  webapi:
    image: ${BFX_BACKEND_IMAGE:?BFX_BACKEND_IMAGE must be a repository@sha256 reference}
    pull_policy: never
    container_name: bfx-webapi
    entrypoint: []
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "bfx_funding_bot.apps.webapi:app", "--host", "127.0.0.1", "--port", "8000"]
    user: "1000:1000"
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/webapi.env
    environment:
      BFX_IMAGE_DIGEST: ${BFX_BACKEND_DIGEST:?BFX_BACKEND_DIGEST is required}
      BFX_SOURCE_REVISION: ${BFX_SOURCE_REVISION:?BFX_SOURCE_REVISION is required}
      BFX_DEPLOYMENT_ID: ${BFX_DEPLOYMENT_ID:?BFX_DEPLOYMENT_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUSERBASE: ""
      LD_PRELOAD: ""
      LD_LIBRARY_PATH: ""
      LD_AUDIT: ""
    # In the holder's namespace with the tailnet node (plan D13): reachable only through
    # Serve on 127.0.0.1:8000; the database through the holder's bfx_default interface.
    network_mode: service:netns
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Holds the ingress network namespace and nothing else (plan D13): the tailscale
  # sidecar and the web API join it with `network_mode: service:netns`,
  # so a tailscaled restart, crash or recreate never replaces the namespace they
  # share. Restarting this container on its own strands them in a namespace without
  # eth0 -- recreate the services with bfx-deploy instead (docs/runbooks/deploy.md).
  netns:
    image: docker.io/tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    pull_policy: never
    container_name: bfx-netns
    entrypoint: ["sleep", "2147483647"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    networks:
      bfx_default: {}

  # The tailnet node tag:bfx-ops. Serve proxies https://<node>:443 to the web API on
  # 127.0.0.1:8000 in the shared namespace (deploy/vm/tailscale/serve.json) and forwards
  # the operator capability the tailnet policy grants. userspace, no capabilities, no ports. The
  # auth key (tagged, single use) is in tailscale.env and used only on the first
  # login; the node key lives in the bfx_tsstate volume.
  tailscale:
    image: docker.io/tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    pull_policy: never
    container_name: bfx-tailscale
    network_mode: service:netns
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    tmpfs: [/tmp, /var/run/tailscale]
    env_file:
      - ${BFX_RUNTIME_DIR:-/opt/bfx/runtime}/tailscale.env
    environment:
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: bfx-ops
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - bfx_tsstate:/var/lib/tailscale
    configs:
      - source: ts-serve
        target: /config/serve.json
    # /healthz answers 200 once the node has a tailnet address; bfx-deploy waits for it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  # A fixed name, so a renamed project never registers a new node.
  bfx_tsstate:
    name: bfx_tsstate

configs:
  ts-serve:
    file: ./tailscale/serve.json

networks:
  bfx_default:
    external: true
    name: bfx_default
