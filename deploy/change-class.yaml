# Release change class rules (ADR 2026-09-25-automated-probation-replaces-release-ceremony D1).
#
# bfx-deploy (deploy/vm/ops/bfx_deploy.py) reads THIS FILE AT THE TARGET COMMIT and
# classifies `git diff --name-only --no-renames <deployed>..<target>`:
#   - a path is standard only if a `standard` pattern matches it AND no `material`
#     pattern does; every other path is material (the default);
#   - one material path makes the whole release material;
#   - anything undecidable (this file missing or malformed, the deployed commit not
#     in history, a failed diff, the first deployment) is material.
# This file itself is always material (hard-wired in change_class.py), so loosening
# the rules needs one operator approval on the release that ships the new rules.
#
# Syntax: a strict YAML subset (version, two block lists, `- pattern` items).
# `*` and `?` stay inside one path segment; `**/` spans directories; a trailing `**`
# spans everything below. Keep it that way -- the parser rejects anything else.
#
# material = anything that can change what the bot sends to the venue or how it
# is gated: order path, strategy/pricing, risk limits, CapitalPolicy, migrations,
# runtime/deploy configuration, dependencies, and the operator auth gate.
# standard = cannot reach the order path: docs, tests, research/report scripts,
# frontend presentation, local dev tooling.

version: 1

standard:
  # Documentation anywhere. Material overrides below still win (e.g. a .md file
  # under backend/src or backend/configs stays material).
  - "**/*.md"
  - "docs/**"
  - "backend/docs/**"

  # Tests and offline test data: not copied into any image (backend/Dockerfile
  # copies src, alembic, configs, scripts only).
  - "backend/tests/**"
  - "backend/fixtures/**"
  - "backend/data/research/**"

  # Frontend (ADR D1: frontend is standard). The server-side operator auth gate
  # is carved out under `material` below.
  - "frontend/**"

  # Research and report scripts. They ship in the backend image but only read
  # data and write reports or research-only tables (liquidations, perp funding,
  # attribution_weekly); none is imported by the daemon or webapi. Scripts that
  # feed live inputs (ingest_funding_stats, learn_*fill_rate -> fill_rate_stats,
  # backfill_*, derive_cells) and operator/DR scripts (bootstrap_*, convert_*,
  # cutover_*, verify_projection_*) are deliberately NOT listed.
  - "backend/scripts/_g3_loaders.py"
  - "backend/scripts/audit_book_period_coverage.py"
  - "backend/scripts/diagnose_warmup_replay_parity.py"
  - "backend/scripts/diff_research_report.py"
  - "backend/scripts/eda_phase3b.py"
  - "backend/scripts/explore_mr_param_sensitivity.py"
  - "backend/scripts/ingest_liquidations.py"
  - "backend/scripts/ingest_perp_funding.py"
  - "backend/scripts/investigate_frr_unit.py"
  - "backend/scripts/report_execution_quality.py"
  - "backend/scripts/run_adaptive_band_sweep.py"
  - "backend/scripts/run_backtest.py"
  - "backend/scripts/run_distortion_sensitivity.py"
  - "backend/scripts/run_frr_floor_backtest.py"
  - "backend/scripts/run_g2_calibration_audit.py"
  - "backend/scripts/run_g3_live_validation.py"
  - "backend/scripts/run_oos_profitability.py"
  - "backend/scripts/run_period_structure_backtest.py"
  - "backend/scripts/run_phase3b_wfo_matrix.py"
  - "backend/scripts/run_phase4_3_locf_wfo_matrix.py"
  - "backend/scripts/run_signal_eda.py"
  - "backend/scripts/run_weekly_attribution.py"

  # Local development tooling that never reaches the VM or an image.
  - ".claude/**"
  - ".github/dependabot.yml"
  - ".gitignore"
  - ".env.example"
  - "lefthook.yml"
  - "skills-lock.json"

  # R2 bucket Terraform: applied by hand, never by bfx-deploy; no image reads it.
  - "infra/**"

material:
  # Listed explicitly so a future broad `standard` glob can never cover them.
  # Observability code lives in backend/src and is therefore material too.
  - "backend/src/**"
  - "backend/configs/**"
  - "backend/alembic/**"
  - "backend/alembic.ini"
  - "backend/pyproject.toml"
  - "backend/uv.lock"
  - "backend/Dockerfile"
  - "deploy/**"
  - "docker-compose.*.yml"
  - ".github/workflows/**"
  # The operator auth gate that T5's TOTP approval / resume / kill switch go
  # through (Better Auth server config, MFA-gated BFF proxy, route middleware,
  # operator bootstrap/revoke one-shots). Weakening it would bypass approval.
  - "frontend/src/app/api/**"
  - "frontend/src/lib/auth.ts"
  - "frontend/middleware.ts"
  - "frontend/scripts/**"
