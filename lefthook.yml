# Lefthook: frontend/ (nextjs+biome)
# 套到：bfx-funding-bot
# 註：Go 後端已於 2026-05-29 移除；現行 backend/ 是 Python 重寫版（2026-09-23 由 backend_py/ 改名）。
# backend 的 lint/test 由 CI（backend_* jobs）把關，未掛 pre-commit hook。
pre-commit:
  parallel: true
  commands:
    frontend-check:
      root: "frontend/"
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: npx @biomejs/biome check --write --staged {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        first_line="$(head -n1 {1})"
        if [[ "$first_line" =~ ^(fixup|squash)!\  ]]; then exit 0; fi
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
        if ! [[ "$first_line" =~ $pattern ]]; then
          echo "commit message 不符合 Conventional Commits 規範" >&2
          echo "格式: <type>(<scope>)?: <subject>（feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert）" >&2
          echo "你的訊息: $first_line" >&2
          exit 1
        fi
        subject="${first_line#*: }"
        if [[ "${subject:0:1}" =~ [A-Z] ]]; then
          echo "commit message 不符合 Conventional Commits 規範: subject 開頭不可大寫" >&2
          exit 1
        fi
        if [[ "$subject" == *. ]]; then
          echo "commit message 不符合 Conventional Commits 規範: subject 結尾不可加句號" >&2
          exit 1
        fi
