# Lefthook: frontend/ (nextjs+biome)
# 套到：bfx-funding-bot
# 註：Go backend/ 已移除（重寫至 backend_py/ 後封存並刪除，2026-05-29）。
# backend_py 的 lint/test 由 CI（backend_py_* jobs）把關，未掛 pre-commit hook。
pre-commit:
  parallel: true
  commands:
    frontend-check:
      root: "frontend/"
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: npx @biomejs/biome check --write --staged {staged_files}
