name: bfx

# Infrastructure definition (PostgreSQL, Redis, ops jobs), NOT the application deployer.
# bot/webapi/frontend are deployed by bfx-deploy as compose project `bfx-app`
# (deploy/vm/docker-compose.app.yml, docs/runbooks/deploy.md). Never broad
# `up --build`/`down`/`--remove-orphans` here. Existing PG18, Redis, runtime env files
# and volumes must remain unchanged. The `legacy-app` profiles below are historical/
# simulation only: never `--profile legacy-app up` (same container names as bfx-app).

services:
  # Self-hosted Postgres — replaces Neon. Internal-only (no published port);
  # the real-money DB must never be reachable from outside the docker network.
  # POSTGRES_USER/PASSWORD/DB come from existing .env.runtime. bfx-deploy does NOT
  # rewrite that file or recreate this service.
  postgres:
    build:
      context: .
      dockerfile: deploy/vm/postgres/Dockerfile
    image: bfx-postgres:local
    container_name: bfx-postgres
    restart: unless-stopped
    env_file: .env.runtime
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=pgbackrest --stanza=bfx archive-push %p
    # Bound to the VM's loopback ONLY — never 0.0.0.0. Reachable from a laptop
    # solely through an SSH tunnel:
    #   ssh -N -L 5433:127.0.0.1:5432 ubuntu@oci-a1
    # Added 2026-07-27 so local analysis can read the real database; before this
    # the local .env still pointed at the decommissioned Neon project and any
    # ad-hoc query silently ran against data frozen at 2026-06-19.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ stores data in a version-specific subdir; the volume must mount at
      # /var/lib/postgresql (NOT /data) or the image refuses to start.
      # See docker-library/postgres#1259.
      - bfx_pgdata:/var/lib/postgresql
      - ./deploy/vm/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${HOME}/bfx/pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
      - ${HOME}/bfx/pgbackrest/spool:/var/spool/pgbackrest
      - ${HOME}/bfx/pgbackrest/log:/var/log/pgbackrest
      - ${HOME}/bfx/dr-evidence:/dr-evidence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bfx-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bfx_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      autoheal: "true"
    # no ports: internal-only (Better Auth secondaryStorage on the compose network)

  migrate:
    profiles: ["legacy-app"]
    image: bfx-bot:local
    command: ["sh", "-c", "alembic upgrade head"]
    working_dir: /app
    # Migrations run as the operator principal; the daemon and weekly report
    # use the restricted runtime URL from .env.runtime.
    env_file:
      - .env.runtime
      - .env.migrate.runtime
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # E3 weekly measurement chain（systemd timer bfx-weekly-report.timer 觸發，
  # profiles: ["ops"] 讓 up -d 不啟動）：① funding_stats forward-fill（AlwaysFRR
  # arm 資料）② attribution 落表 ③ G3 報告。步驟 ① 失敗不擋 ②③（|| echo；
  # attribution/G3 對缺資料 fail-soft）。
  weekly-report:
    image: bfx-bot:local
    profiles: ["ops"]
    working_dir: /app
    env_file: .env.runtime
    restart: "no"
    volumes:
      # Host dir must be writable by uid 1000 (image appuser); OCI ubuntu is uid
      # 1001 → one-time `sudo chown 1000:1001 ~/bfx/reports && chmod 775` on the
      # VM, else the G3 report write dies on EACCES (bit us 2026-07-19).
      - ${HOME}/bfx/reports:/reports
    command:
      - sh
      - -c
      - |
        timeout 600 python -m scripts.ingest_funding_stats --symbols fUST,fUSD || echo "WARN ingest_funding_stats failed/timed out (frr arm may be stale — non-blocking)"
        python -m scripts.run_weekly_attribution
        python -m scripts.run_g3_live_validation --out "/reports/$$(date +%F)-g3-live-validation.md"
        # ── research re-validation (Proposal E, 2026-09-22): runs AFTER the operational
        # report, every step fail-soft, nothing here promotes anything. Budget: see
        # deploy/vm/systemd/bfx-weekly-report.service TimeoutStartSec.
        timeout 900 python -m scripts.ingest_perp_funding --skip-binance || echo "WARN ingest_perp_funding failed/timed out (non-blocking)"
        timeout 1200 python -m scripts.ingest_liquidations || echo "WARN ingest_liquidations failed/timed out (non-blocking)"
        timeout 600 python -m scripts.learn_book_fill_rate || echo "WARN learn_book_fill_rate failed/timed out (non-blocking)"
        timeout 600 python -m scripts.run_period_structure_backtest --fill-model book --output "/reports/$$(date +%F)-period-structure-book.md" || echo "WARN period-structure (book) failed (non-blocking)"
        timeout 600 python -m scripts.run_period_structure_backtest --output "/reports/$$(date +%F)-period-structure-linear.md" || echo "WARN period-structure (linear) failed (non-blocking)"
        timeout 600 python -m scripts.run_oos_profitability --output "/reports/$$(date +%F)-oos-profitability.md" || echo "WARN run_oos_profitability failed (non-blocking)"
        python -m scripts.diff_research_report --kind period-structure --glob "/reports/*-period-structure-book.json" --out "/reports/$$(date +%F)-weekly-research-book.md" || echo "WARN diff (book) failed (non-blocking)"
        python -m scripts.diff_research_report --kind oos --glob "/reports/*-oos-profitability.json" --out "/reports/$$(date +%F)-weekly-research-oos.md" || echo "WARN diff (oos) failed (non-blocking)"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    profiles: ["legacy-app"]
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: bfx-bot:local
    container_name: bfx-bot
    command: ["bfx-shadow"]
    env_file: .env.runtime
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      autoheal: "true"
    healthcheck:
      # python:3.13-slim ships no wget/curl — use the baked-in python (urlopen
      # raises on non-200 / connection-refused → non-zero exit → unhealthy).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  autoheal:
    profiles: ["legacy-app"]
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  webapi:
    profiles: ["legacy-app"]
    image: bfx-bot:local
    container_name: bfx-webapi
    command: ["uvicorn", "bfx_funding_bot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.webapi.runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: ["legacy-app"]
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://oci-a1.tail357fef.ts.net}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-bfx-funding-bot}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-https://oci-a1.tail357fef.ts.net}
    image: bfx-frontend:local
    container_name: bfx-frontend
    env_file: .env.frontend.runtime
    restart: unless-stopped
    ports:
      # host 3000 is taken by grafana (observability); FE host-binds 3001.
      # Funnel 443 → 127.0.0.1:3001. Container still listens on 3000 internally.
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bfx_pgdata:
  bfx_redisdata:
