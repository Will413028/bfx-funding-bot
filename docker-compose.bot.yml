name: bfx

# Infrastructure definition (PostgreSQL), NOT the application deployer.
# The application is deployed by bfx-deploy as compose project `bfx-app`
# (deploy/vm/docker-compose.app.yml, docs/runbooks/deploy.md). Never broad
# `up --build`/`down`/`--remove-orphans` here. The existing PG18, its env file and
# volume must remain unchanged. Redis left with the app login (9d-6).
# The weekly-report job moved to the release-managed host tooling
# (deploy/vm/ops/docker-compose.weekly-report.yml, bfx-weekly-report.service).

services:
  # Self-hosted Postgres — replaces Neon. Internal-only (no published port);
  # the real-money DB must never be reachable from outside the docker network.
  # POSTGRES_USER/PASSWORD/DB come from .env.postgres.runtime (0600, those three keys
  # only): the database never sees the application's secrets. bfx-deploy does NOT
  # rewrite that file or recreate this service.
  postgres:
    build:
      context: .
      dockerfile: deploy/vm/postgres/Dockerfile
    image: bfx-postgres:local
    container_name: bfx-postgres
    restart: unless-stopped
    # archive-async=y forks a background archive-push that outlives its parent. With
    # postgres as PID 1 the postmaster adopts it, and when it exits non-zero (an R2
    # error) the postmaster treats it as a crashed backend and crash-restarts the
    # whole database. docker-init as PID 1 reaps it instead.
    init: true
    env_file: .env.postgres.runtime
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=pgbackrest --stanza=bfx archive-push %p
      # Slow-query detection (operations.md §8 慢查詢): per-statement totals in
      # pg_stat_statements (the extension itself is created once by hand, deploy.md),
      # and the plan of any statement over a second in the container log.
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=1s
    # Bound to the VM's loopback ONLY — never 0.0.0.0. Reachable from a laptop
    # solely through an SSH tunnel:
    #   ssh -N -L 5433:127.0.0.1:5432 <ssh-user>@<vm-host>
    # Added 2026-07-27 so local analysis can read the real database; before this
    # the local .env still pointed at the decommissioned Neon project and any
    # ad-hoc query silently ran against data frozen at 2026-06-19.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ stores data in a version-specific subdir; the volume must mount at
      # /var/lib/postgresql (NOT /data) or the image refuses to start.
      # See docker-library/postgres#1259.
      - bfx_pgdata:/var/lib/postgresql
      - ./deploy/vm/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${HOME}/bfx/pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
      - ${HOME}/bfx/pgbackrest/spool:/var/spool/pgbackrest
      - ${HOME}/bfx/pgbackrest/log:/var/log/pgbackrest
      - ${HOME}/bfx/dr-evidence:/dr-evidence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  bfx_pgdata:
