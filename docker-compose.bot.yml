name: bfx

services:
  # Self-hosted Postgres — replaces Neon. Internal-only (no published port);
  # the real-money DB must never be reachable from outside the docker network.
  # POSTGRES_USER/PASSWORD/DB come from .env.runtime (assembled from ~/bfx/bot.env
  # by deploy-vm.sh); Settings(extra="ignore") makes bot/migrate ignore them.
  postgres:
    image: postgres:18-alpine
    container_name: bfx-postgres
    restart: unless-stopped
    env_file: .env.runtime
    volumes:
      - bfx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: bfx-bot:local
    command: ["sh", "-c", "alembic upgrade head"]
    working_dir: /app
    env_file: .env.runtime
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: backend_py
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: bfx-bot:local
    container_name: bfx-bot
    command: ["bfx-shadow"]
    env_file: .env.runtime
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      autoheal: "true"
    healthcheck:
      # python:3.13-slim ships no wget/curl — use the baked-in python (urlopen
      # raises on non-200 / connection-refused → non-zero exit → unhealthy).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  webapi:
    image: bfx-bot:local
    container_name: bfx-webapi
    command: ["uvicorn", "bfx_funding_bot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.webapi.runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bfx_pgdata:
