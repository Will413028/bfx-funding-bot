name: ${DR_PROJECT_NAME}

services:
  restore-db:
    image: bfx-postgres:local
    container_name: ${DR_CONTAINER_NAME}
    entrypoint: ["/usr/local/bin/bfx-dr-restore"]
    environment:
      DR_VOLUME_NAME: ${DR_VOLUME_NAME}
      DR_TARGET_BACKUP_LABEL: ${DR_TARGET_BACKUP_LABEL}
      DR_TARGET_TIME: ${DR_TARGET_TIME}
      POSTGRES_USER: ${DR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DR_POSTGRES_DB}
    volumes:
      - ${DR_VOLUME_NAME}:/var/lib/postgresql
      - ./deploy/vm/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${DR_PGBACKREST_SECRET_DIR}:/etc/pgbackrest/conf.d:ro
    networks: [dr]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  verifier:
    image: bfx-bot:local
    working_dir: /app
    entrypoint: ["python", "scripts/verify_projection_replay.py"]
    command: ["replay"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BFX_DEPLOYMENT_ENV: ${BFX_DEPLOYMENT_ENV}
    depends_on:
      restore-db:
        condition: service_healthy
    networks: [dr]

volumes:
  restore-data:
    external: true
    name: ${DR_VOLUME_NAME}

networks:
  dr:
    internal: true
    external: true
    name: ${DR_NETWORK_NAME}
